<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pozadí squircle: tmavě modrá (navy) jako u předlohy -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222e4e"/>
      <stop offset="1" stop-color="#141d36"/>
    </linearGradient>
    <!-- Červený disk radaru -->
    <radialGradient id="disk" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#e84136"/>
      <stop offset="0.65" stop-color="#d92e27"/>
      <stop offset="1" stop-color="#bf241f"/>
    </radialGradient>
    <!-- Radarová výseč (sweep) — bílá, doznívá -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.40"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- macOS squircle podklad -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>

  <g clip-path="url(#squircle)">
    <!-- červený disk -->
    <circle cx="512" cy="512" r="318" fill="url(#disk)"/>

    <!-- soustředné radarové kruhy (jemné, uvnitř disku) -->
    <g fill="none" stroke="#ffffff">
      <circle cx="512" cy="512" r="232" stroke-opacity="0.16" stroke-width="6"/>
      <circle cx="512" cy="512" r="140" stroke-opacity="0.14" stroke-width="6"/>
    </g>

    <!-- radarová výseč: doznívající stopa končící paprskem -->
    <path d="M 512 512 L 512 194 A 318 318 0 0 1 787 353 Z"
          fill="url(#sweep)"/>
    <line x1="512" y1="512" x2="787" y2="353" stroke="#ffffff"
          stroke-opacity="0.85" stroke-width="10" stroke-linecap="round"/>

    <!-- obvodové trasy (PCB) = mapa sítě; pady = objevené uzly -->
    <g stroke="#ffffff" stroke-width="22" fill="none"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M 512 512 L 512 372 L 432 292 L 432 206"/>
      <path d="M 512 512 L 376 512 L 308 444 L 308 332"/>
      <path d="M 512 512 L 512 640 L 432 716"/>
      <path d="M 512 512 L 636 636 L 636 712"/>
      <path d="M 636 636 L 728 544"/>
    </g>
    <!-- pady (donuty) na koncích tras -->
    <g fill="#d92e27" stroke="#ffffff" stroke-width="20">
      <circle cx="432" cy="206" r="34"/>
      <circle cx="308" cy="332" r="34"/>
      <circle cx="432" cy="716" r="30"/>
      <circle cx="636" cy="712" r="30"/>
      <circle cx="728" cy="544" r="28"/>
    </g>

    <!-- střed radaru: velký pad -->
    <circle cx="512" cy="512" r="46" fill="#d92e27" stroke="#ffffff" stroke-width="22"/>
    <circle cx="512" cy="512" r="14" fill="#ffffff"/>

    <!-- pár uzlů mimo disk na navy pozadí (sken pokračuje dál) -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="14">
      <circle cx="222" cy="680" r="22"/>
      <circle cx="812" cy="248" r="22"/>
    </g>

    <!-- spodní "terminálová" lišta s otevřenými porty -->
    <g font-family="Menlo" font-weight="bold">
      <rect x="100" y="772" width="824" height="152" fill="#0b1426" opacity="0.92"/>
      <!-- celý řádek ">_ 22 80 443 …" (14 znaků á ~38,6 px) centrovaný na x=512 -->
      <text x="242" y="868" font-size="64" fill="#e84136">&gt;_</text>
      <text x="358" y="868" font-size="64" fill="#ffffff">22 80 443</text>
      <text x="744" y="868" font-size="64" fill="#ffffff" opacity="0.45">…</text>
    </g>
  </g>
</svg>
